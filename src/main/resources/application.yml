server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.studentmanagement.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.studentmanagement.mapper: DEBUG
